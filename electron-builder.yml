appId: com.shmoostudio.app
productName: Shmoo Studio
directories:
  output: release
  buildResources: resources
# 只打包构建产物与清单，源码与样例不进安装包
files:
  - out/**/*
  - package.json
  # 矢量 PDF 导出需要嵌入中文字体（Noto Sans SC 子集，OFL 1.1 允许嵌入分发）
  - assets/fonts/**/*
# 内网离线工具：不配置 publish，electron-builder 就不会生成 app-update.yml，
# 产物里也不会带任何自动更新地址（已由打包后检查确认）。
asar: true
win:
  icon: resources/icon.png
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shmoo Studio
  # 卸载时保留用户目录（导出目录偏好等），避免误删
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
